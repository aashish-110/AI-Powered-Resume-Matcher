<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Upload resumes and compare them with the Associate AI Engineer role.">
  <title>{% block title %}Resume Match{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('index') }}" aria-label="Resume Match home">
      <span class="brand-mark">RM</span>
      <span>Resume Match</span>
    </a>
    <span class="role-label">Associate AI Engineer</span>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>AI-assisted screening · Review results before making hiring decisions</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
